#!/usr/sbin/nft -f
# =============================================================================
# LOONY LINUX — Production nftables Ruleset
# =============================================================================
# Apply:   nft -f /etc/nftables.conf
# Reload:  systemctl restart nftables
# Verify:  nft list ruleset
# =============================================================================

flush ruleset

# ---------------------------------------------------------------------------
# Define variables (sets)
# ---------------------------------------------------------------------------

# Management network — adjust to your actual management CIDR
define MGMT_NETS = { 10.0.0.0/8, 192.168.100.0/24 }

# Trusted upstream proxies (if behind a load balancer)
define TRUSTED_PROXIES = { 192.168.1.0/24 }

# Monitoring server
define MONITORING = { 192.168.1.30 }

# ---------------------------------------------------------------------------
# IPv4 filter
# ---------------------------------------------------------------------------
table inet filter {

    # ------------------------------------------------------------------
    # Dynamic sets for rate limiting
    # ------------------------------------------------------------------

    # Track SSH connection attempts per source IP
    set ssh_conn_track {
        type ipv4_addr
        flags dynamic, timeout
        timeout 60s
    }

    # Track new HTTP connections per source IP (DDoS protection)
    set http_conn_track {
        type ipv4_addr
        flags dynamic, timeout
        timeout 10s
    }

    # Temporary block set (filled by rate-limit rules)
    set blocked {
        type ipv4_addr
        flags timeout
        timeout 1h       # Automatic unblock after 1 hour
    }

    # ------------------------------------------------------------------
    # INPUT chain
    # ------------------------------------------------------------------
    chain input {
        type filter hook input priority 0; policy drop;

        # Drop IPs in the block set first (fast path)
        ip saddr @blocked counter drop

        # Allow loopback (internal OS communication)
        iif lo accept

        # Allow established/related (stateful tracking)
        ct state established, related accept

        # Drop explicitly invalid packets
        ct state invalid counter log prefix "[nft] INVALID: " drop

        # ----- ICMP -----
        # IPv4 ICMP — allow essential types only
        ip protocol icmp icmp type {
            echo-request,       # ping
            echo-reply,
            destination-unreachable,
            time-exceeded,
            parameter-problem
        } limit rate 5/second burst 10 packets accept

        # ----- IPv6 ICMP -----
        ip6 nexthdr icmpv6 icmpv6 type {
            echo-request, echo-reply,
            destination-unreachable, packet-too-big,
            time-exceeded, parameter-problem,
            nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
        } accept

        # ----- Management Network -----
        # Unrestricted access from known management IPs
        ip saddr $MGMT_NETS accept

        # ----- SSH (rate-limited) -----
        # Track connection rate; after 10 new connections/minute, add to block set
        tcp dport 22 ct state new \
            add @ssh_conn_track { ip saddr timeout 60s limit rate over 10/minute } \
            add @blocked { ip saddr timeout 1h } \
            counter log prefix "[nft] SSH-RATELIMIT: " drop

        # Allow SSH within the rate limit
        tcp dport 22 ct state new counter accept

        # ----- HTTP / HTTPS -----
        # Rate-limit new HTTP connections to 200/10s per source IP
        tcp dport { 80, 443 } ct state new \
            add @http_conn_track { ip saddr timeout 10s limit rate over 200/10second } \
            counter log prefix "[nft] HTTP-RATELIMIT: " drop

        tcp dport { 80, 443 } accept

        # ----- Monitoring (Node Exporter, etc.) -----
        ip saddr $MONITORING tcp dport { 9100, 9090, 9113, 9187 } accept

        # ----- Drop everything else (log first) -----
        limit rate 10/second burst 30 packets \
            log prefix "[nft] DROP: " flags all
        counter drop
    }

    # ------------------------------------------------------------------
    # FORWARD chain (drop unless this is a router — see NAT section)
    # ------------------------------------------------------------------
    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    # ------------------------------------------------------------------
    # OUTPUT chain (allow all outgoing)
    # ------------------------------------------------------------------
    chain output {
        type filter hook output priority 0; policy accept;
    }
}

