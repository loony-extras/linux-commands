---
- name: reload sshd
  service:
    name: sshd
    state: reloaded

- name: restart sshd
  service:
    name: sshd
    state: restarted

- name: restart fail2ban
  service:
    name: fail2ban
    state: restarted

- name: restart auditd
  service:
    name: auditd
    state: restarted

- name: restart nftables
  service:
    name: nftables
    state: restarted
