# monitoring/prometheus/prometheus.yml
# Production Prometheus configuration — loony-linux

global:
  scrape_interval: 15s          # How often to scrape targets
  scrape_timeout: 10s           # Timeout per scrape
  evaluation_interval: 15s      # How often to evaluate alert rules

  # Labels added to all metrics from this Prometheus instance
  external_labels:
    cluster: production
    region: us-east-1
    environment: prod

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# Rules files (alerts and recording rules)
rule_files:
  - /etc/prometheus/rules/*.yml

# =============================================================================
# SCRAPE CONFIGURATIONS
# =============================================================================
scrape_configs:

  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: prometheus

  # ---------------------------------------------------------------------------
  # Node Exporter — system metrics (CPU, memory, disk, network)
  # ---------------------------------------------------------------------------
  - job_name: node
    static_configs:
      - targets:
          - web-01:9100
          - web-02:9100
          - db-01:9100
          - db-02:9100
    relabel_configs:
      # Extract hostname from target address
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '$1'
    metric_relabel_configs:
      # Drop high-cardinality filesystem metrics for tmpfs
      - source_labels: [fstype]
        regex: 'tmpfs'
        action: drop

  # ---------------------------------------------------------------------------
  # Nginx Prometheus Exporter
  # Install: https://github.com/nginxinc/nginx-prometheus-exporter
  # ---------------------------------------------------------------------------
  - job_name: nginx
    static_configs:
      - targets:
          - web-01:9113
          - web-02:9113
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '$1'

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter (postgres_exporter)
  # ---------------------------------------------------------------------------
  - job_name: postgresql
    static_configs:
      - targets:
          - db-01:9187
          - db-02:9187
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '$1'

  # ---------------------------------------------------------------------------
  # Redis Exporter
  # ---------------------------------------------------------------------------
  - job_name: redis
    static_configs:
      - targets:
          - app-01:9121

  # ---------------------------------------------------------------------------
  # cAdvisor — Docker container metrics
  # ---------------------------------------------------------------------------
  - job_name: cadvisor
    static_configs:
      - targets:
          - web-01:8080
          - web-02:8080
    metric_relabel_configs:
      # Only keep useful container labels
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      # Drop metrics for pause containers (overhead)
      - source_labels: [name]
        regex: '.*_POD_.*|.*pause.*'
        action: drop

  # ---------------------------------------------------------------------------
  # Application metrics (custom /metrics endpoint)
  # ---------------------------------------------------------------------------
  - job_name: myapp
    metrics_path: /metrics
    scheme: http
    basic_auth:
      username: metrics
      password_file: /etc/prometheus/secrets/myapp-metrics-password
    static_configs:
      - targets:
          - app-01:8080
          - app-02:8080
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '$1'

  # ---------------------------------------------------------------------------
  # Blackbox Exporter — HTTP/TCP endpoint probing
  # ---------------------------------------------------------------------------
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://app.company.com/health
          - https://api.company.com/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - db-01:5432
          - cache:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # Alertmanager self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
