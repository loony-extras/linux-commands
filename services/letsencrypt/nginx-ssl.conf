# /etc/nginx/sites-available/example.com — HTTPS with Let's Encrypt (webroot mode)
# =============================================================================
# 1. sudo mkdir -p /var/www/letsencrypt
# 2. Enable ONLY the port-80 server below, reload nginx, then get the certificate:
#      sudo certbot certonly --webroot -w /var/www/letsencrypt -d example.com -d www.example.com
# 3. Enable the 443 server, `nginx -t`, reload. Renewals reuse the same webroot.
#
# TLS settings follow Mozilla's "intermediate" profile. No OCSP stapling:
# Let's Encrypt certificates no longer carry an OCSP URL.
# =============================================================================

# HTTP: serve ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    # nginx >= 1.25.1 prefers `listen 443 ssl;` plus `http2 on;` (this form still works, with a warning)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS: browsers refuse plain HTTP for 2 years. Add `; includeSubDomains` only if
    # EVERY subdomain serves HTTPS.
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /var/www/example.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
