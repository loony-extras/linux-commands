---
- name: reload systemd
  systemd:
    daemon_reload: true

- name: restart node-exporter
  service:
    name: node-exporter
    state: restarted

- name: restart prometheus
  service:
    name: prometheus
    state: restarted

- name: reload prometheus
  uri:
    url: http://localhost:9090/-/reload
    method: POST
    status_code: 200
  ignore_errors: true
