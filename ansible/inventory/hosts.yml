---
all:
  vars:
    ansible_user: admin
    ansible_ssh_private_key_file: ~/.ssh/prod_ed25519
    ansible_ssh_common_args: '-o StrictHostKeyChecking=yes -o ConnectTimeout=10'
    ansible_python_interpreter: /usr/bin/python3

  children:
    web:
      hosts:
        web-01:
          ansible_host: 192.168.1.10
          nginx_server_name: app.company.com
        web-02:
          ansible_host: 192.168.1.11
          nginx_server_name: app.company.com
      vars:
        nginx_workers: 4
        app_replicas: 2

    db:
      hosts:
        db-01:
          ansible_host: 192.168.1.20
          postgres_replication_role: primary
        db-02:
          ansible_host: 192.168.1.21
          postgres_replication_role: replica
      vars:
        postgres_max_connections: 200
        postgres_shared_buffers: "2GB"

    monitoring:
      hosts:
        mon-01:
          ansible_host: 192.168.1.30

    bastion:
      hosts:
        bastion-01:
          ansible_host: 1.2.3.4     # Public IP
          ansible_port: 2222
          ansible_ssh_private_key_file: ~/.ssh/bastion_ed25519

    # Hosts reached via bastion jump
    internal:
      children:
        web:
        db:
        monitoring:
      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=yes
          -o ProxyJump=admin@1.2.3.4:2222
